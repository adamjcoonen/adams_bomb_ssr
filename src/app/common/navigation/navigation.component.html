<ng-container *ngIf="isHandset$ | async; else desktopNav">
  <button mat-icon-button [matMenuTriggerFor]="menu">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item *ngFor="let link of navLinks" [routerLink]="link.routerLink">
      {{ link.label }}
    </button>
  </mat-menu>
</ng-container>

<ng-template #desktopNav>
  <div class="desktop-nav-links">
    <button mat-button *ngFor="let link of navLinks" [routerLink]="link.routerLink">
      {{ link.label }}
    </button>
  </div>
</ng-template>
