<div class="podcast-view-container">
    <h1 class="header">Podcast Presentation</h1>
    
    <mat-accordion>
        <mat-expansion-panel *ngFor="let episode of episodes">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    {{ episode.title }}
                </mat-panel-title>
            </mat-expansion-panel-header>
            <p>{{ episode.details }}</p>
        </mat-expansion-panel>
        
    </mat-accordion>
</div>
