framework: angular
outputDirectory: dist/adams_bomb_ssr/browser
server: 
  entrypoint: dist/adams_bomb_ssr/server/server.mjs
runConfig:
  minInstances: 0
  maxInstances: 50
  concurrency: 10
  cpu: 1
  memoryMiB: 1024
env:
  - variable: MESSAGE
    value: Hello world!
  - variable: DATO_CMS_TOKEN
    secret: DATO_CMS_TOKEN 
    availability:
      - BUILD
      - RUNTIME
  - variable: google-maps-api-key 
    secret: google-maps-api-key 
    availability:
      - BUILD
      - RUNTIME
  - variable: google-maps-map-id
    secret: google-maps-map-id 
    availability:
      - BUILD
      - RUNTIME