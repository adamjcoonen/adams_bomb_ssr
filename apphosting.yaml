# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
framework: angular
outputDirectory: dist/adams_bomb_ssr/browser
server: 
  entrypoint: dist/adams_bomb_ssr/server/server.mjs
runConfig:
  minInstances: 2
  maxInstances: 100
  concurrency: 100
  cpu: 2
  memoryMiB: 1024
  serviceAccount: firebase-app-hosting-compute@adamsbombcomedy.iam.gserviceaccount.com

# Environment variables and secrets.
env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  - variable: MESSAGE
    value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  - variable: DATO_CMS_TOKEN
    secret:
      name: DATO_CMS_TOKEN
      version: latest
    availability:
      - BUILD
      - RUNTIME
    secretManager: true
  - variable: google-maps-api-key
    secret:
      name: google-maps-api-key
      version: latest
    availability:
      - BUILD
      - RUNTIME
    secretManager: true
  - variable: google-maps-api-id
    secret:
      name: google-maps-api-id
      version: latest
    availability:
      - BUILD
      - RUNTIME
    secretManager: true
