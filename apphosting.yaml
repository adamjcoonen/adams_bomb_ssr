# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
framework: angular
outputDirectory: dist/adams_bomb_ssr/browser
server: 
  entrypoint: dist/adams_bomb_ssr/server/server.mjs
runConfig:
  minInstances: 2
  maxInstances: 100
  concurrency: 100
  cpu: 2
  memoryMiB: 1024
  serviceAccount: adams-ssr-runtime-sa@adamsbombcomedy.iam.gserviceaccount.com


# Environment variables and secrets.
env:
  - variable: DATO_CMS_TOKEN
    secret: DATO_CMS_TOKEN # This MUST be the ID/name of your secret in Secret Manager
    availability:
      - BUILD
      - RUNTIME
  - variable: google-maps-api-key # Ensure this 'variable' name is what set-env.js uses
    secret: google-maps-api-key # This MUST be the ID/name of your secret in Secret Manager
    availability:
      - BUILD
      - RUNTIME
  - variable: google-maps-api-id
    secret: google-maps-api-id # This MUST be the ID/name of your secret in Secret Manager
    availability:
      - BUILD
      - RUNTIME