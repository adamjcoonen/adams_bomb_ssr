# apphosting.yaml
framework: angular
outputDirectory: dist/adams_bomb_ssr/browser
server: 
  entrypoint: dist/adams_bomb_ssr/server/server.mjs
runConfig:
  minInstances: 0
  maxInstances: 100
  concurrency: 100
  cpu: 0
  memoryMiB: 1024
env:
  - variable: MESSAGE
    value: Hello world!
  - variable: DATO_CMS_TOKEN
    secret: DATO_CMS_TOKEN 
    availability:
      - BUILD
      - RUNTIME
  - variable: google-maps-api-key 
    secret: google-maps-api-key 
    availability:
      - BUILD
      - RUNTIME
  # - variable: Maps_API_KEY
  #   secret: Maps_API_KEY # Reference the secret created in Secret Manager
  #   availability:
  #       - RUNTIME # Make it available at runtime, not build time