# apphosting.yaml
framework: angular
outputDirectory: dist/adams_bomb_ssr/browser
server: 
  entrypoint: dist/adams_bomb_ssr/server/server.mjs
runConfig:
  minInstances: 2
  maxInstances: 100
  concurrency: 100
  cpu: 2
  memoryMiB: 1024
  serviceAccount: adams-ssr-runtime-sa@adamsbombcomedy.iam.gserviceaccount.com
env:
  - variable: MESSAGE
    value: Hello world!
  - variable: DATO_CMS_TOKEN
    secret: DATO_CMS_TOKEN 
    availability:
      - BUILD
      - RUNTIME
  - variable: google-maps-api-key 
    secret: google-maps-api-key 
    availability:
      - BUILD
      - RUNTIME
  - variable: google-maps-api-id
    secret: google-maps-api-id 
    availability:
      - BUILD
      - RUNTIME